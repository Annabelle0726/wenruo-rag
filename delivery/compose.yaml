name: ${DELIVERY_PROJECT:?Initialize delivery first}
services:
  wenruo-rag-cpu:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
    profiles: [cpu]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        WEB_DIST_MODE: ${WEB_DIST_MODE:-prebuilt}
        WEB_BUILD_HEAP_MB: 4096
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Build from the reviewed release}
    image: ${RAGFLOW_IMAGE:?Set a verified immutable image}
    ports: ["${SVR_WEB_HTTP_PORT:-9222}:80"]
    env_file: private/runtime.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MINIO_HOST: minio
      ES_HOST: es01
      REDIS_HOST: redis
      WENRUO_PRIVATE_KEY_FILE: /delivery-state/login-private.pem
      WENRUO_PUBLIC_KEY_FILE: /delivery-state/login-public.pem
      DB_TYPE: mysql
      SECRET_KEY: ${SECRET_KEY:?Initialize delivery first}
      API_PROXY_SCHEME: python
      DOC_ENGINE: elasticsearch
      REGISTER_ENABLED: "0"
      ENABLE_REGISTER: "0"
      RAGFLOW_INIT_SUPERUSER: "0"
    entrypoint: ["python", "/ragflow/delivery/entrypoint.py"]
    command: ["--enable-adminserver", "--disable-datasync"]
    volumes:
      - app_logs:/ragflow/logs
      - ./private:/delivery-state
      - ${DELIVERY_PACKAGE:?Select a verified package}:/delivery-package:ro
      - ../docker/service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template:ro
    depends_on:
      mysql: {condition: service_healthy}
      es01: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    restart: unless-stopped
  mysql:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
    image: mysql@sha256:d58ac93387f644e4e040c636b8f50494e78e5afc27ca0a87348b2f577da2b7ff
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Run initialize-delivery.ps1 first}
      MYSQL_DATABASE: rag_flow
    command: ["--max-connections=1000", "--max-allowed-packet=1073741824"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 120
    restart: unless-stopped
  es01:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
    image: elasticsearch@sha256:58a3a280935d830215802322e9a0373faaacdfd646477aa7e718939c2f29292a
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Run initialize-delivery.ps1 first}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 5s
      retries: 120
    restart: unless-stopped
  minio:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
    image: pgsty/silo@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
    environment:
      MINIO_ROOT_USER: wenruo
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run initialize-delivery.ps1 first}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes: [minio_data:/data]
    restart: unless-stopped
  redis:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
    image: valkey/valkey@sha256:3fbd2e3e4b6e85e046c1e7c215e8f79087bc0357789184305806664e320996f3
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD:?Run initialize-delivery.ps1 first}"]
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 120
    restart: unless-stopped
volumes:
  mysql_data:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
  esdata:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
  minio_data:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
  redis_data:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
  app_logs:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
networks:
  default:
    labels: {org.wenruo.delivery.instance: "${DELIVERY_INSTANCE:?Initialize delivery first}"}
