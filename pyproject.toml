    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "reportlab>=4.4.1",
    "requests>=2.32.2",
    "requests-toolbelt>=1.0.0",
    "pycryptodomex==3.20.0",
    "pytest-playwright>=0.7.2",
    "codecov>=2.1.13",
]

[tool.uv]
constraint-dependencies = [
    "pyasn1>=0.6.4",
    "trio>=0.26.0",
    "urllib3>=2.7.0",
    "lxml>=6.1.1",
    "lxml_html_clean>=0.4.5",
    "inscriptis>=2.7.3",
    "nltk>=3.10.0",
    "protobuf>=5.29.6",
    "httplib2>=0.32.0",
    "orjson>=3.11.6",
    "cbor2>=5.9.0",
    "azure-core>=1.38.0",
    "curl_cffi>=0.15.0"
]
exclude-dependencies = [
    "unclecode-litellm",
    "agentrun-mem0ai",
]
override-dependencies = [
    "attrs>=23.2.0",
    "numpy>=2.1,<2.6",
    "quart>=0.19.0,<0.20.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"

[tool.uv.sources]
trio = [{ index = "pypi" }]

[tool.setuptools]
packages = [
    'agent',
    'api',
    'deepdoc',
    'rag.graphrag',
    'tools.chatgpt_on_wechat.plugins',
    'mcp.server',
    'rag',
    'sdk.python.ragflow_sdk',
]

[tool.setuptools.package-dir]
"tools.chatgpt_on_wechat.plugins" = "tools/chatgpt-on-wechat/plugins"

[tool.ruff]
line-length = 200
exclude = [".venv"]

[tool.ruff.lint]
extend-select = ["ASYNC", "ASYNC1"]
ignore = ["E402"]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "p0: critical priority test cases",
    "p1: high priority test cases",
    "p2: medium priority test cases",
    "p3: low priority test cases",
    "smoke: smoke test cases",
    "auth: authentication UI tests",
    "asyncio: mark test as async",
]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:pkg_resources is deprecated:UserWarning",
]

addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
    "--color=yes",
    "-p",
    "no:anyio",
]

[tool.coverage.run]
source = [
    "../../common",
]

omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.pytest_cache/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
    "*/site-packages/*",
    "*/dist/*",
    "*/build/*",
    "*/migrations/*",
    "setup.py"
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 0

exclude_lines = [
    "pass"
]

[tool.coverage.html]
directory = "htmlcov"
title = "Test Coverage Report"